name: WASM UI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build WASM UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Include tags for the published build label.

      - name: Test site version stamping
        run: python3 scripts/test_package_wasm_ui.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-wasm-ui

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Bun cache
        uses: actions/cache@v4
        with:
          path: crates/pocket-tts-cli/web/node_modules
          key: bun-${{ hashFiles('crates/pocket-tts-cli/web/bun.lock') }}

      - name: Build CLI web UI
        run: |
          cd crates/pocket-tts-cli/web
          bun install
          bun run build

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Install wasm-opt
        # Ubuntu's Binaryen 108 corrupts wasm-bindgen's externref table export.
        run: |
          archive="$RUNNER_TEMP/binaryen.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz \
            -o "$archive"
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  $archive" | sha256sum -c
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"

      - name: Build wasm package
        run: bash scripts/build-wasm.sh

      - name: Package GitHub Pages site
        run: bash scripts/package-wasm-ui.sh dist/wasm-ui

      - name: Smoke-test packaged WASM initialization
        run: node scripts/test-wasm-init.mjs dist/wasm-ui/wasm/pkg

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-ui
          path: dist/wasm-ui
          if-no-files-found: error

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/wasm-ui

  deploy:
    name: Deploy WASM UI to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
