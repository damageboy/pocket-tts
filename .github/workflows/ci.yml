name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-clippy
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
      - name: Bun cache
        uses: actions/cache@v4
        with:
          path: crates/pocket-tts-cli/web/node_modules
          key: bun-${{ hashFiles('crates/pocket-tts-cli/web/bun.lock') }}
      - name: Build Web UI
        run: |
          cd crates/pocket-tts-cli/web
          bun install
          bun run build
      - name: Run clippy (Linux/Windows)
        if: matrix.os != 'macos-latest'
        run: |
          cargo clippy -p pocket-tts --all-targets -- -D warnings
          cargo clippy -p pocket-tts-cli --all-targets -- -D warnings
      - name: Run clippy (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cargo clippy -p pocket-tts --all-targets --features metal -- -D warnings
          cargo clippy -p pocket-tts-cli --all-targets --features metal -- -D warnings
        env:
          RUSTFLAGS: "-C target-cpu=apple-m1 -C target-feature=+aes,+sha2"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-test
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
      - name: Bun cache
        uses: actions/cache@v4
        with:
          path: crates/pocket-tts-cli/web/node_modules
          key: bun-${{ hashFiles('crates/pocket-tts-cli/web/bun.lock') }}
      - name: Build Web UI
        run: |
          cd crates/pocket-tts-cli/web
          bun install
          bun run build
      - name: Run pocket-tts tests (Linux/Windows)
        if: matrix.os != 'macos-latest'
        run: cargo test --release -p pocket-tts
      - name: Check pocket-tts-cli compiles (Linux/Windows)
        if: matrix.os != 'macos-latest'
        run: cargo check --release -p pocket-tts-cli --tests
      - name: Run pocket-tts tests (macOS)
        if: matrix.os == 'macos-latest'
        run: cargo test --release -p pocket-tts --features metal
        env:
          RUSTFLAGS: "-C target-cpu=apple-m1 -C target-feature=+aes,+sha2"
      - name: Check pocket-tts-cli compiles (macOS)
        if: matrix.os == 'macos-latest'
        run: cargo check --release -p pocket-tts-cli --tests --features metal
        env:
          RUSTFLAGS: "-C target-cpu=apple-m1 -C target-feature=+aes,+sha2"

  install-cli:
    name: Install CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-install
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
      - name: Bun cache
        uses: actions/cache@v4
        with:
          path: crates/pocket-tts-cli/web/node_modules
          key: bun-${{ hashFiles('crates/pocket-tts-cli/web/bun.lock') }}
      - name: Build Web UI
        run: |
          cd crates/pocket-tts-cli/web
          bun install
          bun run build
      - name: Install pocket-tts-cli from path
        run: cargo install --path crates/pocket-tts-cli --locked --force
