[workspace]
resolver = "2"
members = [
  "crates/pocket-tts",
  "crates/pocket-tts-cli",
  "crates/pocket-tts-bindings",

]

[workspace.package]
version = "0.8.1"
edition = "2024"
authors = ["Pocket TTS Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/babybirdprd/pocket-tts"
homepage = "https://github.com/babybirdprd/pocket-tts"
keywords = ["tts", "candle", "speech-synthesis", "audio"]
categories = ["multimedia::audio", "science"]

[workspace.dependencies]
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
hf-hub = { version = "1.0.0", features = ["blocking"] }
anyhow = "1.0"
thiserror = "2.0"
hound = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
byteorder = "1.5"
memmap2 = "0.9"
clap = { version = "4.5", features = ["derive"] }
tokenizers = { version = "0.23.1", default-features = false }
axum = "0.8"
tokio = "1.0"
tower = "0.5"
tower-http = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
intel-mkl-src = { version = "0.8.1", features = ["mkl-static-lp64-iomp"] }
rand = "0.10"
rand_distr = "0.6"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
debug = true
