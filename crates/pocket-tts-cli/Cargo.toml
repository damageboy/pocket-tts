[package]
name = "pocket-tts-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI and API server for Pocket TTS"
keywords.workspace = true
categories.workspace = true
build = "build.rs"
include = [
  "src/**/*",
  "Cargo.toml",
  "web/dist/**/*",
  "tests/**/*",
  "../../.cargo/config.toml",
]

[lib]
name = "pocket_tts_cli"
path = "src/lib.rs"

[features]
default = ["web-ui", "playback"]
playback = ["dep:rodio", "dep:crossterm", "dep:ctrlc", "dep:regex", "dep:unicode-width", "dep:unicode-segmentation"]
external-cli-tests = []
web-ui = [
  "rust-embed",
  "mime_guess",
  "percent-encoding",
  "pocket-tts/quantized",
]
quantized = ["pocket-tts/quantized"]
metal = ["pocket-tts/metal", "candle-core/metal"]
mkl = ["pocket-tts/mkl"]

[dependencies]
pocket-tts = { path = "../pocket-tts", version = "0.8.1" }
candle-core.workspace = true
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
axum = { workspace = true, features = ["multipart"] }
base64 = "0.23"
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio-stream = "0.1"
futures-util = "0.3"
indicatif = "0.18"
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["fs", "trace", "cors"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
owo-colors = "4.3"
rodio = { version = "0.22.2", default-features = false, features = ["playback"], optional = true }
crossterm = { version = "0.29", default-features = false, optional = true }
ctrlc = { version = "3.5", optional = true }
regex = { version = "1", optional = true }
unicode-width = { version = "0.2", optional = true }
unicode-segmentation = { version = "1", optional = true }
hound = "3.5"
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }
percent-encoding = { version = "2.3", optional = true }

[dev-dependencies]
assert_cmd = "2.2"
tokio = { workspace = true, features = ["full", "test-util"] }
tower = { workspace = true, features = ["util"] }

[[test]]
name = "base64_tests"
path = "tests/base64_tests.rs"
required-features = ["external-cli-tests"]

[[test]]
name = "server_tests"
path = "tests/server_tests.rs"
required-features = ["external-cli-tests"]

[[test]]
name = "stream_tests"
path = "tests/stream_tests.rs"
required-features = ["external-cli-tests"]
